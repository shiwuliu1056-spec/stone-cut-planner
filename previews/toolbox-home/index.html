<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>宝松工具箱 · 首页预览</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./styles.css">
  <script src="./feedback.js" defer></script>
</head>
<body>
  <!-- 微信和手机外壳仅用于展示，不属于工具箱业务界面。 -->
  <div class="phone">
    <div class="platform-chrome" aria-hidden="true">
      <div class="status-bar">
        <span class="clock">9:41</span>
        <div class="status-icons">
          <svg viewBox="0 0 18 14"><path d="M1 13V10M5 13V7M9 13V4M13 13V1" stroke="currentColor" stroke-width="2.5"/></svg>
          <svg viewBox="0 0 24 24"><path d="M2 8.8a16 16 0 0 1 20 0M5 12.2a11 11 0 0 1 14 0M8.5 15.6a5.5 5.5 0 0 1 7 0"/><circle cx="12" cy="19" r="1" fill="currentColor" stroke="none"/></svg>
          <svg class="battery" viewBox="0 0 28 14"><rect x="1" y="2" width="22" height="10" rx="2"/><path d="M26 5v4"/><rect x="3" y="4" width="18" height="6" rx="1" fill="currentColor" stroke="none"/></svg>
        </div>
      </div>
      <div class="wechat-bar">
        <span>宝松工具箱</span>
        <div class="wechat-capsule"><span class="dots">•••</span><i></i><span class="close-ring"></span></div>
      </div>
    </div>

    <header class="brand">
      <div class="brand-copy">
        <span class="brand-kicker">BAOSONG / TOOLBOX</span>
        <h1>宝松工具箱</h1>
        <p>拥抱AI<span class="tagline-gap">提高效率</span></p>
      </div>
      <svg class="brand-art" viewBox="0 0 150 150" fill="none" aria-hidden="true">
        <path d="M75 10 140 48v75l-65 38-65-38V48Z"/>
        <path d="m75 38 41 24v47l-41 24-41-24V62Z"/>
        <path d="m75 65 17 10v20l-17 10-17-10V75Z"/>
        <path d="M75 10v28m65 10-24 14M10 48l24 14m41 71v28"/>
        <circle cx="116" cy="62" r="3"/>
      </svg>
    </header>

    <main>
      <div class="directory-heading"><h2>选择工具</h2><span>03 / TOOLS</span></div>
      <div class="tool-list">
        <button type="button" class="tool-card" aria-label="石材下料：录入尺寸，生成材料排版图">
          <span class="tool-number" aria-hidden="true">01</span>
          <span class="tool-copy">
            <span class="tool-name">石材下料</span>
            <span class="tool-description">录入尺寸，生成材料排版图</span>
          </span>
          <svg class="tool-art slab-art" viewBox="0 0 112 96" fill="none" aria-hidden="true">
            <rect class="art-wash" x="7" y="10" width="96" height="76" rx="13"/>
            <path class="art-faint" d="M5 2v4m0 84v4M108 2v4m0 84v4M2 5h4m98 0h6M2 91h4m98 0h6"/>
            <rect class="art-line" x="15" y="18" width="78" height="59" rx="3"/>
            <rect class="art-fill" x="21" y="24" width="35" height="23" rx="1.5"/>
            <rect class="art-fill" x="21" y="53" width="35" height="18" rx="1.5"/>
            <rect class="art-accent-fill" x="62" y="24" width="25" height="47" rx="1.5"/>
            <path class="art-accent" d="M17 86h74m-74-3v6m74-6v6"/>
          </svg>
        </button>

        <button type="button" class="tool-card" aria-label="视频去水印：解析视频，提取语音文案">
          <span class="tool-number" aria-hidden="true">02</span>
          <span class="tool-copy">
            <span class="tool-name">视频去水印</span>
            <span class="tool-description">解析视频，提取语音文案</span>
          </span>
          <svg class="tool-art video-art" viewBox="0 0 112 96" fill="none" aria-hidden="true">
            <circle class="art-wash" cx="56" cy="48" r="43"/>
            <rect class="art-faint" x="20" y="13" width="80" height="55" rx="5"/>
            <rect class="art-paper" x="11" y="23" width="80" height="55" rx="5"/>
            <path class="art-accent-fill" d="m43 37 21 13-21 13Z"/>
            <path class="art-faint" d="M24 87h18m5 0h5m5 0h23"/>
            <path class="art-accent" d="M83 14v8m-4-4h8M98 34v6m-3-3h6"/>
          </svg>
        </button>

        <button type="button" class="tool-card" aria-label="起诉助手：填写案件信息，生成起诉材料。适用九江买卖合同纠纷">
          <span class="tool-number" aria-hidden="true">03</span>
          <span class="tool-copy">
            <span class="tool-name">起诉助手</span>
            <span class="tool-description">填写案件信息，生成起诉材料</span>
            <span class="tool-scope">九江 · 买卖合同纠纷</span>
          </span>
          <svg class="tool-art claim-art" viewBox="0 0 112 96" fill="none" aria-hidden="true">
            <circle class="art-wash" cx="57" cy="48" r="42"/>
            <path class="art-faint" d="M30 17H19v65a4 4 0 0 0 4 4h51v-9"/>
            <path class="art-paper" d="M33 8h34l20 20v45a4 4 0 0 1-4 4H33a4 4 0 0 1-4-4V12a4 4 0 0 1 4-4Z"/>
            <path class="art-accent" d="M67 8v16a4 4 0 0 0 4 4h16"/>
            <path class="art-line" d="M41 38h17m-17 9h32m-32 9h32m-32 9h20"/>
            <circle class="art-accent-fill" cx="83" cy="73" r="13"/>
            <path class="check" d="m77 73 4 4 8-9"/>
          </svg>
        </button>
      </div>
    </main>
    <div class="home-indicator" aria-hidden="true"></div>
  </div>
</body>
</html>
