# Only the toolbox is exposed on this new HTTPS listener.
log_format bstools_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name cacci.cn;
    charset utf-8;
    access_log /var/log/nginx/bstools-access.log bstools_safe;
    ssl_certificate /etc/letsencrypt/live/cacci.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cacci.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:BSTOOLS_SSL:10m;
    ssl_session_timeout 1d;

    location = /bstools { return 308 /bstools/; }
    location = /bstools/ {
        proxy_pass http://127.0.0.1:3200/api/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location ^~ /bstools/api/ {
        client_max_body_size 64m;
        proxy_pass http://127.0.0.1:3200/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_buffering off;
    }
    location / { return 404; }
}
